name: Atualizar Certificações no README

on:
  push:
    paths:
      - 'certificacoes/credential-*.json'
      - 'cursos/credential-*.json'
  workflow_dispatch: # Permite execução manual pela aba "Actions" no GitHub

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão crucial para que o GitHub Actions possa modificar o README.md e fazer o commit de volta

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Rodar o script de atualização
      run: python update_readme.py

    - name: Fazer Commit e Push do README atualizado
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "docs: atualiza lista de certificações no README [skip ci]"
        file_pattern: 'README.md'
